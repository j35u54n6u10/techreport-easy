<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#075e54" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25d366" />
      <stop offset="100%" stop-color="#128c7e" />
    </linearGradient>
    <linearGradient id="flag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />

  <!-- Outer subtle glow ring -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#25d366" stroke-width="6" stroke-opacity="0.3" />

  <!-- Institutional Venezuelan flag strip accent on top right -->
  <g transform="translate(370, 40)">
    <rect x="0" y="0" width="70" height="12" rx="6" fill="#facc15" />
    <rect x="0" y="16" width="70" height="12" rx="6" fill="#2563eb" />
    <rect x="0" y="32" width="70" height="12" rx="6" fill="#dc2626" />
  </g>

  <!-- Document / Report Base -->
  <rect x="116" y="100" width="280" height="340" rx="28" fill="#ffffff" filter="drop-shadow(0px 14px 28px rgba(0,0,0,0.4))" />

  <!-- Document Header Bar -->
  <rect x="116" y="100" width="280" height="64" rx="28" fill="#075e54" />
  <rect x="116" y="136" width="280" height="28" fill="#075e54" />

  <!-- Header lines -->
  <circle cx="156" cy="132" r="14" fill="#25d366" />
  <rect x="186" y="126" width="140" height="12" rx="6" fill="#ffffff" />

  <!-- Report Content Lines -->
  <rect x="150" y="190" width="160" height="12" rx="6" fill="#0f172a" />
  <rect x="150" y="214" width="210" height="8" rx="4" fill="#94a3b8" />
  <rect x="150" y="230" width="180" height="8" rx="4" fill="#94a3b8" />

  <!-- WhatsApp Checkmarks -->
  <g transform="translate(150, 260)">
    <circle cx="14" cy="14" r="14" fill="#25d366" />
    <path d="M8 14 l4 4 l8 -8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="40" y="10" width="140" height="8" rx="4" fill="#334155" />
  </g>

  <g transform="translate(150, 304)">
    <circle cx="14" cy="14" r="14" fill="#25d366" />
    <path d="M8 14 l4 4 l8 -8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="40" y="10" width="120" height="8" rx="4" fill="#334155" />
  </g>

  <g transform="translate(150, 348)">
    <circle cx="14" cy="14" r="14" fill="#25d366" />
    <path d="M8 14 l4 4 l8 -8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="40" y="10" width="150" height="8" rx="4" fill="#334155" />
  </g>

  <!-- Floating Tech / Wrench Badge -->
  <g transform="translate(320, 320)">
    <circle cx="60" cy="60" r="54" fill="url(#accent)" filter="drop-shadow(0px 8px 16px rgba(37,211,102,0.4))" />
    <!-- Bolt / Zap icon inside badge -->
    <path d="M62 34 L42 64 L58 64 L54 86 L78 54 L62 54 Z" fill="#ffffff" />
  </g>
</svg>
